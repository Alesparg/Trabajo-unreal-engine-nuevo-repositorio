[FilterPlugin]
; Extra runtime files packaged with the plugin beyond Source/ and Binaries/.

; Plugin config — DefaultLocoHelperAI.ini must be present at startup so CDO
; values are layered before SessionManager reads them on PostEngineInit.
/Config/DefaultLocoHelperAI.ini
/Config/FilterPlugin.ini

; ThirdParty: ripgrep metadata + binary used by the optional code_search tool.
; The rg.exe binary ships only in the regular (direct-download) build variant.
; Whitelist entries that aren't present in the staging directory are ignored.
/Source/ThirdParty/ripgrep/Win64/rg.exe
/Source/ThirdParty/ripgrep/LICENSE-MIT
/Source/ThirdParty/ripgrep/UNLICENSE
/Source/ThirdParty/ripgrep/VERSION.txt

; WebUI bundle consumed by SLocoBrowserWrapper at runtime
/Source/WebUI/build/...

; Runtime resources (plugin icon, audio SFX, asset-pack manifests)
/Resources/Icon128.png
/Resources/Audio/*.wav
/Resources/Audio/audio_manifest.json
/Resources/AssetPacks/*.json

; Documentation
/README.txt

; Repair / cache-clear utility (support tool; safe named deletes only, never
; touches keys, CLI logins, settings, or chat history without an explicit prompt)
/Wingman-Repair.bat
